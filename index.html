<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Platformer Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            border: 4px solid #333;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 10;
        }

        #info p {
            margin: 5px 0;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
            color: white;
            font-size: 14px;
        }

        .controls p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div>
        <div id="gameContainer">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="info">
                <p>Score: <span id="score">0</span></p>
                <p>Level: <span id="level">1</span></p>
            </div>
        </div>
        <div class="controls">
            <p><strong>Controls:</strong> A/D or Arrow Keys to move | SPACE to jump</p>
            <p>Collect coins and reach the flag to complete the level!</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
